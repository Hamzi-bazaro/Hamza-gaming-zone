
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hamza Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050518;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    color: white;
}

.calculator {
    width: 95%;
    max-width: 400px;
    padding: 20px;
    background: #101024;
    border: 2px solid #29205a;
    border-radius: 25px;
    box-shadow: 0 0 25px #4420a5;
}

h1 {
    text-align: center;
    color: #a34bff;
    font-size: 28px;
}

.display {
    background: #050510;
    border: 2px solid #9b27ff;
    border-radius: 18px;
    min-height: 120px;
    padding: 20px;
    margin-bottom: 20px;
    text-align: right;
    overflow-wrap: anywhere;
}

#expression {
    color: #aaa;
    font-size: 20px;
    min-height: 25px;
}

#result {
    font-size: 38px;
    margin-top: 12px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

button {
    height: 70px;
    border: none;
    border-radius: 16px;
    background: #292938;
    color: white;
    font-size: 26px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(0.94);
}

.operator {
    background: linear-gradient(135deg,#a52cff,#5900df);
}

.clear {
    background: #e53955;
}

.equal {
    grid-column: span 2;
    background: linear-gradient(135deg,#a52cff,#5900df);
}

.zero {
    grid-column: span 2;
}

footer {
    text-align: center;
    margin-top: 20px;
    color: #aaa;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="calculator">

<h1>🧮 HAMZA</h1>

<div class="display">
    <div id="expression">Welcome!</div>
    <div id="result">0</div>
</div>

<div class="buttons">

<button class="clear" onclick="clearAll()">C</button>
<button onclick="backspace()">⌫</button>
<button onclick="percent()">%</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button class="zero" onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>

<footer>Created by Hamza ❤️</footer>

</div>

<script>
let expression = "";

const result = document.getElementById("result");
const screen = document.getElementById("expression");

function add(value) {
    expression += value;
    screen.innerText = expression;
    result.innerText = expression;
}

function clearAll() {
    expression = "";
    screen.innerText = "Welcome!";
    result.innerText = "0";
}

function backspace() {
    expression = expression.slice(0, -1);
    screen.innerText = expression || "Welcome!";
    result.innerText = expression || "0";
}

function percent() {
    try {
        expression = String(Function(
            '"use strict"; return (' + expression + ') / 100'
        )());
        screen.innerText = expression;
        result.innerText = expression;
    } catch {
        result.innerText = "Error";
    }
}

function calculate() {
    try {
        if (!expression || !/^[0-9+\-*/.() ]+$/.test(expression)) {
            throw new Error("Invalid");
        }

        let answer = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(answer)) {
            throw new Error("Invalid");
        }

        screen.innerText = expression + " =";
        result.innerText = Number(answer.toPrecision(12));
        expression = String(Number(answer.toPrecision(12)));

    } catch {
        result.innerText = "Error";
        expression = "";
    }
}
</script>

</body>
</html>
